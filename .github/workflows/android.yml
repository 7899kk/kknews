name: Expiry Radar Android preview and APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run local automated checks
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Enable temporary emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 9 device tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon --max-workers=2
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.karthikkilari.expiryradar
            python3 scripts/android_preview.py previews/android-9
      - name: Preserve Android 9 test evidence
        if: always()
        run: mkdir -p previews/reports-android-9 && cp -r app/build/reports/androidTests previews/reports-android-9/ 2>/dev/null || true
      - name: Android 16 device tests and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          script: |
            ./gradlew connectedDebugAndroidTest --rerun-tasks --no-daemon --max-workers=2
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.karthikkilari.expiryradar
            python3 scripts/android_preview.py previews/android-16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expiry-radar-apk-and-device-evidence
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            previews/
      - name: Publish tested APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ExpiryRadar-debug.apk
          zip -r ExpiryRadar-Android-preview.zip previews app/build/reports/androidTests app/build/reports/tests app/build/reports/lint-results-debug.html
          gh release create "expiry-radar-preview-${{ github.run_number }}" ExpiryRadar-debug.apk ExpiryRadar-Android-preview.zip --target "$GITHUB_SHA" --title 'Expiry Radar tested Android preview' --prerelease --notes 'Debug APK. Automated local checks and instrumented UI/database tests on temporary Android 9 and Android 16 emulators. Camera/OCR accuracy, physical device power restrictions, and Play signing still need physical-device/release validation. Screenshots and test evidence are attached.'
